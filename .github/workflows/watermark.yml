# Turns, resizes and watermarks photos as soon as they're uploaded in /admin.
name: Prepare photos

on:
  push:
    branches: [main]
    paths: ["images/**", "content/fixes.json", ".github/scripts/watermark.py"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prepare-photos
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow==12.0.0
      - run: python .github/scripts/watermark.py
      - name: Save prepared photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add -A images originals .github/watermarked.json
          git diff --cached --quiet && exit 0
          git commit -m "Prepare new photos (turn, resize, watermark)"
          git pull --rebase
          git push
