# Settings for the admin dashboard at /admin (Sveltia CMS).
backend:
  name: github
  repo: joshuagnathan-sketch/website
  branch: main

site_url: https://joshuagnathan.com
display_url: https://joshuagnathan.com

# Uploaded photos are saved in /images
media_folder: images
public_folder: /images

# Shrink and compress photos automatically before they're saved,
# so huge camera files upload reliably and the site stays fast.
media_libraries:
  default:
    config:
      transformations:
        raster_image:
          format: webp
          quality: 85
          width: 2400
          height: 2400

collections:
  - name: pages
    label: Website
    files:
      - name: photos
        label: Photos
        file: content/photos.json
        format: json
        fields:
          - name: photos
            label: Photos (newest first; the home page shows the first 6)
            label_singular: Photo batch
            widget: list
            summary: "{{fields.category}} {{fields.caption}}"
            fields:
              - { name: images, label: Photos (select as many as you want at once), widget: image, multiple: true }
              - { name: captions, label: "Captions, one per line (line 1 = first photo, line 2 = second photo...). Leave a line blank to skip a photo.", widget: text, required: false }
              - { name: caption, label: Shared caption (used for any photo without its own line above), widget: string, required: false }
              - { name: category, label: "Category (astro, nature, film, travel...)", widget: string, required: false }

      - name: trips
        label: Trips
        file: content/trips.json
        format: json
        fields:
          - name: trips
            label: Trips (newest first)
            label_singular: Trip
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { name: title, label: Trip name, widget: string }
              - { name: place, label: Where, widget: string, required: false }
              - { name: when, label: When (for example "Summer 2026"), widget: string, required: false }
              - { name: description, label: Description (leave a blank line between paragraphs), widget: text, required: false }
              - { name: images, label: Trip photos (select as many as you want at once), widget: image, multiple: true, required: false }
              - { name: captions, label: "Photo captions, one per line, in the same order as the photos above", widget: text, required: false }

      - name: projects
        label: Projects
        file: content/projects.json
        format: json
        fields:
          - name: projects
            label: Projects
            label_singular: Project
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { name: title, label: Project name, widget: string }
              - { name: status, label: Status (for example "Ongoing" or "Completed 2026"), widget: string, required: false }
              - { name: summary, label: One-sentence summary, widget: string, required: false }
              - { name: description, label: Description (leave a blank line between paragraphs), widget: text, required: false }
              - { name: images, label: Photos (one or many), widget: image, multiple: true, required: false }

      - name: site
        label: About and site info
        file: content/site.json
        format: json
        fields:
          - { name: name, label: Your name, widget: string }
          - { name: tagline, label: Home page tagline, widget: string, required: false }
          - { name: about, label: About me (leave a blank line between paragraphs), widget: text, required: false }
          - { name: gear, label: Gear, label_singular: Item, widget: list, field: { name: item, label: Item, widget: string }, required: false }
          - { name: email, label: "Public email (optional, leave blank to hide)", widget: string, required: false }
          - { name: instagram, label: Instagram username (optional), widget: string, required: false }
